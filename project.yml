name: Rinse
options:
  bundleIdPrefix: com.nikolaikushner
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: S37Z4QU5FT
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    # Xcode's debug dylib (for previews) leaves content-blocker extensions hanging at launch:
    # Safari's reload times out with SFErrorDomain 3 and never reaches beginRequest.
    ENABLE_DEBUG_DYLIB: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/macOS.entitlements
    "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES

targets:
  # Container app: onboarding and extension status. One target per platform (Rinse_iOS, Rinse_macOS).
  Rinse:
    type: application
    platform: [iOS, macOS]
    sources:
      - App
      - Shared
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Rinse
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolaikushner.rinse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rinse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        # App Group for settings shared with the extensions.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/macOS-shared.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/iOS-shared.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/iOS-shared.entitlements
    dependencies:
      - target: RinseYouTube_${platform}
      - target: RinseAds_${platform}
      - target: RinsePrivacy_${platform}
      - target: RinseCosmetic_${platform}

  # Safari Web Extension for youtube.com: strips ad payloads from the player, adds PiP and background playback.
  RinseYouTube:
    type: app-extension
    platform: [iOS, macOS]
    sources:
      - path: Extensions/YouTube
        excludes: ["Resources/**", "Info.plist"]
      - path: Extensions/YouTube/Resources
        buildPhase: resources
      - Shared/Settings.swift
      - Shared/Allowlist.swift
      - Shared/Extensions.swift
      - Shared/ContentBlockers.swift
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Extensions/YouTube/Info.plist
      properties:
        CFBundleDisplayName: Rinse for YouTube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableDescription: Removes ads from YouTube and adds Picture in Picture and background playback.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_NAME: RinseYouTube
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolaikushner.rinse.youtube
        # App Group for settings shared with the extensions.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/macOS-shared.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/iOS-shared.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/iOS-shared.entitlements

  # Content Blockers for the whole web. Rules come from tools/filters/compile.py.
  RinseAds:
    templates: [ContentBlocker]
    templateAttributes: { name: Ads, id: ads, title: Rinse Ads }
  RinsePrivacy:
    templates: [ContentBlocker]
    templateAttributes: { name: Privacy, id: privacy, title: Rinse Privacy }
  RinseCosmetic:
    templates: [ContentBlocker]
    templateAttributes: { name: Cosmetic, id: cosmetic, title: Rinse Page Cleaner }

targetTemplates:
  ContentBlocker:
    type: app-extension
    platform: [iOS, macOS]
    sources:
      - path: Extensions/Blockers/${name}
        excludes: ["Info.plist"]
      - Extensions/Blockers/Shared
      - Shared/Settings.swift
      - Shared/Allowlist.swift
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Extensions/Blockers/${name}/Info.plist
      properties:
        CFBundleDisplayName: ${title}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    settings:
      base:
        PRODUCT_NAME: Rinse${name}
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolaikushner.rinse.${id}
        # App Group: the blockers read the allowlist the app and the Safari popup write.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/macOS-shared.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/iOS-shared.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/iOS-shared.entitlements
        # Safari's content-blocker extension point needs a PlugInKit subsystem from the platform UI
        # framework; an unused Swift import gets dead-stripped, so link it explicitly.
        "OTHER_LDFLAGS[sdk=macosx*]": "$(inherited) -framework AppKit"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -framework UIKit"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(inherited) -framework UIKit"
